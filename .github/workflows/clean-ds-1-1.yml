name: Clean design system 1.1 checks

on:
  push:
    branches: [design-system-clean-v1-1]
    paths:
      - 'clean-ds-1.1/**'
      - 'index.html'
      - 'manifest.json'
      - 'design-system.css'
      - '.github/workflows/clean-ds-1-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static token contract
        run: python3 clean-ds-1.1/validate.py
      - name: Full VD Design integration contract
        run: python3 clean-ds-1.1/validate-app-integration.py
      - name: Contrast audit
        run: python3 clean-ds-1.1/contrast_audit.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        working-directory: clean-ds-1.1
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Browser and mobile-WebKit checks
        working-directory: clean-ds-1.1
        run: npm test
      - name: Summarize test outcome
        if: always()
        run: |
          echo '## Clean DS 1.1 — automated checks' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review the job steps for the static contract, contrast audit, and browser results.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Screenshots, HTML report and traces (when available) are attached below as an artifact.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-ds-playwright-evidence
          path: |
            clean-ds-1.1/test-results
            clean-ds-1.1/playwright-report
          if-no-files-found: ignore
